  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

)}\n  #note .sign{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:14.5px;color:var(--dim)}\n  #note svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}\n\n  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:18px}\n  .mini{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}\n  .mini .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}\n  .mini .v{font-family:\"Noto Serif Bengali\",serif;font-weight:700;font-size:20px;margin-top:4px;color:var(--gold)}\n  .mini p{margin:6px 0 0;font-size:14.5px;color:var(--dim)}\n\n  #bdList{margin:12px 0 0;padding-left:0;list-style:none;display:grid;\n    grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:4px 18px}\n  #bdList:empty{display:none}\n  #bdList li{font-size:14.5px;color:var(--dim);padding:3px 0;border-bottom:1px solid #1d2634}\n  #bdList li b{color:var(--ink);font-weight:600}\n  .foot{margin-top:48px;border-top:1px solid var(--line);padding-top:14px;\n    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--dim)}\n  @media print{\n    body{background:#fff;color:#15181d}\n    .brandbar,nav.tabs,header.hero,.foot{display:none}\n    section.view{display:none !important}\n    section.view#v-note{display:block !important}\n    #note b,#note .note b{color:#15181d}\n    #note .note{background:#f6f2e9;border-left-color:#8a5a12}\n    #note h2,#note th,#note td{border-color:#d7d2c6}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n  <div class=\"brandbar\">\n    <span class=\"name\">GK with SHIHAB<\u002Fspan>\n    <span class=\"meta\">ভূগোল পাঠশালা<\u002Fspan>\n  <\u002Fdiv>\n\n  <header class=\"hero\">\n    <div class=\"kicker\">ইন্টারঅ্যাকটিভ পাঠ · শ্রেণিকক্ষে দেখানোর উপযোগী<\u002Fdiv>\n    <h1>পৃথিবীর কল্পিত রেখা — ঘুরিয়ে, খুলে খুলে শেখা<\u002Fh1>\n    <p>অক্ষাংশ, দ্রাঘিমাংশ, বিষুবরেখা, কর্কটক্রান্তি আর গ্রিনিচ মান সময় — একটিই পাতা, চারটি অংশ। পুরো সাইট এক ফাইলে, তাই লিংক শেয়ার করলেই সব কাজ করে।<\u002Fp>\n  <\u002Fheader>\n\n  <nav class=\"tabs\" id=\"tabs\">\n    <button type=\"button\" data-v=\"globe\" aria-selected=\"true\">ত্রিমাত্রিক গ্লোব<\u002Fbutton>\n    <button type=\"button\" data-v=\"bd3d\" aria-selected=\"false\">বাংলাদেশের ৩ডি মানচিত্র<\u002Fbutton>\n    <button type=\"button\" data-v=\"bd\" aria-selected=\"false\">বাংলাদেশের মানচিত্র<\u002Fbutton>\n    <button type=\"button\" data-v=\"note\" aria-selected=\"false\">ক্লাস নোট<\u002Fbutton>\n    <button type=\"button\" data-v=\"facts\" aria-selected=\"false\">এক নজরে<\u002Fbutton>\n  <\u002Fnav>\n\n  <section class=\"view on\" id=\"v-globe\">\n    <div class=\"layout\">\n      <div>\n        <div class=\"stagebox\">\n          <three-d-stage name=\"okkho-draghima-globe\" background=\"#0a0f16\"><\u002Fthree-d-stage>\n        <\u002Fdiv>\n        <p class=\"hint\">ড্র্যাগ করে ঘোরান · স্ক্রল করে জুম · টুলবার থেকে OBJ বা GLB ডাউনলোড<\u002Fp>\n        <div class=\"caption\">\n          <h2 id=\"capTitle\">—<\u002Fh2>\n          <p id=\"capBody\"><\u002Fp>\n          <p class=\"fact\" id=\"capFact\"><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <aside class=\"panel\">\n        <h3>ধাপসমূহ<\u002Fh3>\n        <p class=\"sub\">এক ধাপ করে এগোন, বা নিচের সুইচ দিয়ে যেকোনো স্তর আলাদা করে দেখুন।<\u002Fp>\n        <div class=\"steps\" id=\"steps\"><\u002Fdiv>\n        <div class=\"nav\">\n          <button id=\"prev\" type=\"button\">← আগের<\u002Fbutton>\n          <button id=\"next\" type=\"button\">পরের →<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"toggles\" id=\"toggles\"><span class=\"cap\">স্তর<\u002Fspan><\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"view\" id=\"v-bd3d\">\n    <div class=\"layout\">\n      <div>\n        <div class=\"stagebox\">\n          <three-d-stage id=\"bdstage\" name=\"bangladesh-3d-map\" background=\"#0a0f16\"><\u002Fthree-d-stage>\n        <\u002Fdiv>\n        <p class=\"hint\">ড্র্যাগ করে ঘোরান · স্ক্রল করে জুম · টুলবার থেকে OBJ বা GLB ডাউনলোড<\u002Fp>\n        <div class=\"caption\">\n          <h2 id=\"bdTitle\">—<\u002Fh2>\n          <p id=\"bdBody\"><\u002Fp>\n          <p class=\"fact\" id=\"bdFact\"><\u002Fp>\n          <ul id=\"bdList\"><\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <aside class=\"panel\">\n        <h3>ধাপসমূহ<\u002Fh3>\n        <p class=\"sub\">বাংলাদেশের ভূখণ্ড থেকে শুরু করে বিভাগ, জেলা, নদী, ফসল, পরিবেশ ও প্রাণী — এক এক করে খুলে দেখুন।<\u002Fp>\n        <div class=\"steps\" id=\"bdSteps\"><\u002Fdiv>\n        <div class=\"nav\">\n          <button id=\"bdPrev\" type=\"button\">← আগের<\u002Fbutton>\n          <button id=\"bdNext\" type=\"button\">পরের →<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"toggles\" id=\"bdToggles\"><span class=\"cap\">স্তর<\u002Fspan><\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"view\" id=\"v-bd\">\n    <div class=\"split\">\n      <div>\n        <h2 class=\"sec\">বাংলাদেশের মানচিত্রে রেখাগুলো<\u002Fh2>\n        <p class=\"sec-sub\">অক্ষাংশ-দ্রাঘিমাংশের জালের ওপর বাংলাদেশ, তার মধ্য দিয়ে চলে যাওয়া কর্কটক্রান্তি রেখা, আর চার দিক।<\u002Fp>\n        <div class=\"bdmap\"><svg id=\"bdmap\" viewBox=\"0 0 620 700\" role=\"img\" aria-label=\"বাংলাদেশের মানচিত্র\"><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h2 class=\"sec\">অবস্থান<\u002Fh2>\n        <p class=\"sec-sub\">পরীক্ষায় সরাসরি কাজে আসে।<\u002Fp>\n        <table class=\"facts\">\n          <tbody><tr><th>বিষয়<\u002Fth><th>মান<\u002Fth><\u002Ftr>\n          <tr><td>অক্ষাংশ<\u002Ftd><td>২০°৩৪′–২৬°৩৮′ উ.<\u002Ftd><\u002Ftr>\n          <tr><td>দ্রাঘিমাংশ<\u002Ftd><td>৮৮°০১′–৯২°৪১′ পূ.<\u002Ftd><\u002Ftr>\n          <tr><td>গোলার্ধ<\u002Ftd><td>উত্তর গোলার্ধ<\u002Ftd><\u002Ftr>\n          <tr><td>কর্কটক্রান্তি<\u002Ftd><td>দেশের মধ্যভাগ দিয়ে<\u002Ftd><\u002Ftr>\n          <tr><td>আদর্শ দ্রাঘিমা<\u002Ftd><td>৯০° পূ.<\u002Ftd><\u002Ftr>\n          <tr><td>সময়<\u002Ftd><td>GMT + ৬:০০<\u002Ftd><\u002Ftr>\n          <tr><td>রাজধানী ঢাকা<\u002Ftd><td>২৩.৮° উ., ৯০.৪° পূ.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody><\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"view\" id=\"v-note\">\n    <div id=\"note\"><div class=\"title\">\n    <h1>পৃথিবীর কল্পিত রেখা ও বাংলাদেশের অবস্থান<\u002Fh1>\n    <p>অক্ষাংশ, দ্রাঘিমাংশ, বিষুব রেখা, কর্কটক্রান্তি রেখা ও গ্রিনিচ মান সময় — সংক্ষিপ্ত ও পরীক্ষামুখী নোট<\u002Fp>\n  <\u002Fdiv>\n\n  <h2>১. ভূমিকা<\u002Fh2>\n  <p>পৃথিবী গোলাকার, তাই এর উপরিভাগে কোনো স্থানের সঠিক অবস্থান বোঝাতে কেবল দিক বললে চলে না। এজন্য ভূগোলবিদরা পৃথিবীর গায়ে কিছু কল্পিত রেখা ধরে নিয়েছেন। এই রেখাগুলো বাস্তবে মাটিতে আঁকা নেই, কিন্তু এগুলোর সাহায্যেই যেকোনো স্থানের অবস্থান, জলবায়ু-অঞ্চল এবং সময় নির্ণয় করা যায়।<\u002Fp>\n\n  <h2>২. অক্ষাংশ<span class=\"en\">Latitude<\u002Fspan><\u002Fh2>\n  <p>বিষুবরেখা থেকে পৃথিবীর কেন্দ্র ধরে কোনো স্থানের উত্তরে বা দক্ষিণে যে কোণিক দূরত্ব, তাকে সেই স্থানের অক্ষাংশ বলে। অক্ষাংশ ডিগ্রি (°), মিনিট (′) ও সেকেন্ড (″)-এ প্রকাশ করা হয়।<\u002Fp>\n  <ul>\n    <li>পরিমাপ বিষুবরেখা (০°) থেকে শুরু হয়ে উত্তর ধ্রুবে ৯০° উত্তর এবং দক্ষিণ ধ্রুবে ৯০° দক্ষিণে শেষ হয়।<\u002Fli>\n    <li>একই অক্ষাংশের স্থানগুলো যোগ করে পূর্ব-পশ্চিমে যে বৃত্ত পাওয়া যায়, তাকে <b>অক্ষরেখা<\u002Fb> বলে।<\u002Fli>\n    <li>অক্ষরেখাগুলো পরস্পর সমান্তরাল; বিষুবরেখা সবচেয়ে বড় এবং ধ্রুবের দিকে ক্রমশ ছোট হয়ে বিন্দুতে পরিণত হয়।<\u002Fli>\n    <li>মোট অক্ষরেখার সংখ্যা ১৮১টি (বিষুবরেখা ১টি + উত্তরে ৯০টি + দক্ষিণে ৯০টি)।<\u002Fli>\n  <\u002Ful>\n  <div class=\"note\"><b>মনে রাখো:<\u002Fb> ১° অক্ষাংশের ব্যবধান প্রায় ১১১ কিলোমিটার। অক্ষাংশ দিয়ে জলবায়ু ও তাপমাত্রার ধারণা পাওয়া যায় — বিষুবরেখার কাছে উষ্ণ, ধ্রুবের কাছে শীতল।<\u002Fdiv>\n\n  <h2>৩. দ্রাঘিমাংশ<span class=\"en\">Longitude<\u002Fspan><\u002Fh2>\n  <p>মূল মধ্যরেখা (গ্রিনিচ) থেকে কোনো স্থানের পূর্বে বা পশ্চিমে কোণিক দূরত্বকে সেই স্থানের দ্রাঘিমাংশ বলে।<\u002Fp>\n  <ul>\n    <li>পরিমাপ ০° থেকে ১৮০° পূর্ব এবং ০° থেকে ১৮০° পশ্চিম পর্যন্ত।<\u002Fli>\n    <li>উত্তর ও দক্ষিণ ধ্রুবকে যোগ করে যে অর্ধবৃত্তাকার রেখা পাওয়া যায়, তাকে <b>দ্রাঘিমারেখা<\u002Fb> বা মধ্যরেখা বলে।<\u002Fli>\n    <li>সব দ্রাঘিমারেখার দৈর্ঘ্য সমান এবং সবগুলো দুই ধ্রুবে এসে মিলিত হয়।<\u002Fli>\n    <li>মোট দ্রাঘিমারেখার সংখ্যা ৩৬০টি।<\u002Fli>\n    <li>১৮০° দ্রাঘিমারেখাকে ঘিরে নির্ধারিত হয়েছে <b>আন্তর্জাতিক তারিখ রেখা<\u002Fb>।<\u002Fli>\n  <\u002Ful>\n\n  <h2>৪. অক্ষাংশ ও দ্রাঘিমাংশের পার্থক্য<\u002Fh2>\n  <table>\n    <thead><tr><th>বিষয়<\u002Fth><th>অক্ষাংশ<\u002Fth><th>দ্রাঘিমাংশ<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>মাপের শুরু<\u002Ftd><td>বিষুবরেখা (০°)<\u002Ftd><td>মূল মধ্যরেখা / গ্রিনিচ (০°)<\u002Ftd><\u002Ftr>\n      <tr><td>বিস্তার<\u002Ftd><td>০°–৯০° উত্তর ও দক্ষিণ<\u002Ftd><td>০°–১৮০° পূর্ব ও পশ্চিম<\u002Ftd><\u002Ftr>\n      <tr><td>রেখার আকৃতি<\u002Ftd><td>সমান্তরাল পূর্ণ বৃত্ত<\u002Ftd><td>ধ্রুবে মিলিত অর্ধবৃত্ত<\u002Ftd><\u002Ftr>\n      <tr><td>দৈর্ঘ্য<\u002Ftd><td>সমান নয় — ধ্রুবের দিকে ছোট<\u002Ftd><td>সবগুলোর দৈর্ঘ্য সমান<\u002Ftd><\u002Ftr>\n      <tr><td>সংখ্যা<\u002Ftd><td>১৮১টি<\u002Ftd><td>৩৬০টি<\u002Ftd><\u002Ftr>\n      <tr><td>কী নির্ণয় করা যায়<\u002Ftd><td>জলবায়ু ও তাপ-অঞ্চল<\u002Ftd><td>স্থানীয় সময় ও তারিখ<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2>৫. বিষুব রেখা<span class=\"en\">Equator<\u002Fspan><\u002Fh2>\n  <p>০° অক্ষাংশে পৃথিবীর ঠিক মধ্যভাগ দিয়ে পূর্ব-পশ্চিমে যে বৃহত্তম কল্পিত বৃত্ত পৃথিবীকে বেষ্টন করে আছে, তাকে বিষুব রেখা বা নিরক্ষরেখা বলে।<\u002Fp>\n  <ul>\n    <li>এটি পৃথিবীকে <b>উত্তর গোলার্ধ<\u002Fb> ও <b>দক্ষিণ গোলার্ধ<\u002Fb> — সমান দুই ভাগে ভাগ করে।<\u002Fli>\n    <li>এর দৈর্ঘ্য প্রায় ৪০,০৭৫ কিলোমিটার; এটিই পৃথিবীর বৃহত্তম বৃত্ত।<\u002Fli>\n    <li>এখানে সারা বছর দিন ও রাতের দৈর্ঘ্য প্রায় সমান (১২ ঘণ্টা)।<\u002Fli>\n    <li>সূর্যরশ্মি প্রায় লম্বভাবে পড়ে, তাই এ অঞ্চল উষ্ণ ও আর্দ্র; বৃষ্টিপাত বেশি।<\u002Fli>\n  <\u002Ful>\n\n  <h2>৬. কর্কটক্রান্তি ও মকরক্রান্তি রেখা<span class=\"en\">Tropic of Cancer &amp; Capricorn<\u002Fspan><\u002Fh2>\n  <p>পৃথিবীর অক্ষ তার কক্ষপথের সঙ্গে ৬৬½° কোণে হেলে আছে। এই হেলে থাকার কারণেই সূর্য কখনো বিষুবরেখার উত্তরে, কখনো দক্ষিণে লম্বভাবে কিরণ দেয়। সূর্য সর্বোচ্চ যতদূর উত্তরে ও দক্ষিণে লম্বভাবে কিরণ দিতে পারে, সেই দুই সীমারেখাই কর্কটক্রান্তি ও মকরক্রান্তি।<\u002Fp>\n  <h3>কর্কটক্রান্তি রেখা<\u002Fh3>\n  <ul>\n    <li>অবস্থান <b>২৩° ৩০′ উত্তর অক্ষাংশ<\u002Fb>।<\u002Fli>\n    <li>২১ জুন সূর্য এই রেখার ওপর লম্বভাবে কিরণ দেয়। একে <b>কর্কট সংক্রান্তি<\u002Fb> বলে; উত্তর গোলার্ধে তখন দীর্ঘতম দিন ও ক্ষুদ্রতম রাত।<\u002Fli>\n    <li>রেখাটি বাংলাদেশের মধ্যভাগ দিয়ে গেছে, তাই বাংলাদেশ ক্রান্তীয় (উষ্ণমণ্ডল) অঞ্চলের দেশ।<\u002Fli>\n  <\u002Ful>\n  <h3>মকরক্রান্তি রেখা<\u002Fh3>\n  <ul>\n    <li>অবস্থান <b>২৩° ৩০′ দক্ষিণ অক্ষাংশ<\u002Fb>।<\u002Fli>\n    <li>২২ ডিসেম্বর সূর্য এই রেখার ওপর লম্বভাবে কিরণ দেয় — <b>মকর সংক্রান্তি<\u002Fb>; দক্ষিণ গোলার্ধে তখন দীর্ঘতম দিন।<\u002Fli>\n  <\u002Ful>\n  <div class=\"note\">কর্কটক্রান্তি ও মকরক্রান্তির মধ্যবর্তী অঞ্চলকে <b>উষ্ণমণ্ডল<\u002Fb>, ২৩½° থেকে ৬৬½° পর্যন্ত <b>নাতিশীতোষ্ণমণ্ডল<\u002Fb> এবং ৬৬½° থেকে ৯০° পর্যন্ত <b>হিমমণ্ডল<\u002Fb> বলে। ২১ মার্চ ও ২৩ সেপ্টেম্বর সূর্য বিষুবরেখার ওপর লম্বভাবে কিরণ দেয়, তখন পৃথিবীর সর্বত্র দিন-রাত সমান।<\u002Fdiv>\n\n  <h2>৭. গ্রিনিচ মান সময়<span class=\"en\">Greenwich Mean Time — GMT<\u002Fspan><\u002Fh2>\n  <p>লন্ডনের কাছে গ্রিনিচ মান-মন্দিরের ওপর দিয়ে যাওয়া ০° দ্রাঘিমারেখাকে <b>মূল মধ্যরেখা<\u002Fb> ধরা হয়। এই রেখার স্থানীয় সময়কেই পৃথিবীর আদর্শ সময় বা গ্রিনিচ মান সময় (GMT) বলা হয়; অন্য সব স্থানের সময় এর সঙ্গে তুলনা করে হিসাব করা হয়।<\u002Fp>\n  <ul>\n    <li>পৃথিবী নিজ অক্ষে ২৪ ঘণ্টায় ৩৬০° আবর্তন করে। অর্থাৎ <b>১ ঘণ্টায় ১৫°<\u002Fb> এবং <b>১° দ্রাঘিমায় ৪ মিনিট<\u002Fb>।<\u002Fli>\n    <li>গ্রিনিচের পূর্বে গেলে সময় <b>এগিয়ে<\u002Fb> যায়, পশ্চিমে গেলে <b>পিছিয়ে<\u002Fb> যায়।<\u002Fli>\n    <li>প্রতি ১৫° অন্তর ধরে পৃথিবীকে ২৪টি সময় অঞ্চলে ভাগ করা হয়েছে।<\u002Fli>\n  <\u002Ful>\n  <div class=\"note\"><b>হিসাবের নিয়ম:<\u002Fb> বাংলাদেশের আদর্শ দ্রাঘিমা ৯০° পূর্ব। ৯০ × ৪ মিনিট = ৩৬০ মিনিট = ৬ ঘণ্টা। তাই বাংলাদেশ সময় = <b>GMT + ৬ ঘণ্টা<\u002Fb>। গ্রিনিচে সকাল ৮টা হলে বাংলাদেশে তখন দুপুর ২টা।<\u002Fdiv>\n\n  <h2>৮. বাংলাদেশের ভৌগোলিক অবস্থান<\u002Fh2>\n  <div class=\"two\">\n    <div>\n      <ul>\n        <li>অক্ষাংশ: <b>২০° ৩৪′ – ২৬° ৩৮′ উত্তর<\u002Fb><\u002Fli>\n        <li>দ্রাঘিমাংশ: <b>৮৮° ০১′ – ৯২° ৪১′ পূর্ব<\u002Fb><\u002Fli>\n        <li>অবস্থান উত্তর গোলার্ধে ও গ্রিনিচের পূর্বে।<\u002Fli>\n        <li>কর্কটক্রান্তি রেখা দেশের মধ্যভাগ দিয়ে গেছে — ফলে জলবায়ু ক্রান্তীয় মৌসুমি ধরনের।<\u002Fli>\n        <li>আদর্শ সময় ৯০° পূর্ব দ্রাঘিমা অনুসারে, GMT + ৬ ঘণ্টা।<\u002Fli>\n        <li>সীমানা: উত্তর, পূর্ব ও পশ্চিমে ভারত; দক্ষিণ-পূর্বে মিয়ানমার; দক্ষিণে বঙ্গোপসাগর।<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <figure>\n      <svg id=\"bdmap2\" viewBox=\"0 0 340 400\" role=\"img\" aria-label=\"বাংলাদেশের মানচিত্রে কর্কটক্রান্তি রেখা\"><\u002Fsvg>\n      <figcaption>বাংলাদেশের মানচিত্র: অক্ষাংশ-দ্রাঘিমাংশের জাল ও কর্কটক্রান্তি রেখা<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <h2>৯. এক নজরে গুরুত্বপূর্ণ তথ্য<\u002Fh2>\n  <table>\n    <thead><tr><th>বিষয়<\u002Fth><th>মান<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>বিষুব রেখার অক্ষাংশ<\u002Ftd><td>০°<\u002Ftd><\u002Ftr>\n      <tr><td>বিষুব রেখার দৈর্ঘ্য<\u002Ftd><td>প্রায় ৪০,০৭৫ কিমি<\u002Ftd><\u002Ftr>\n      <tr><td>কর্কটক্রান্তি রেখা<\u002Ftd><td>২৩° ৩০′ উত্তর<\u002Ftd><\u002Ftr>\n      <tr><td>মকরক্রান্তি রেখা<\u002Ftd><td>২৩° ৩০′ দক্ষিণ<\u002Ftd><\u002Ftr>\n      <tr><td>সুমেরুবৃত্ত / কুমেরুবৃত্ত<\u002Ftd><td>৬৬° ৩০′ উত্তর / দক্ষিণ<\u002Ftd><\u002Ftr>\n      <tr><td>মূল মধ্যরেখা<\u002Ftd><td>০° দ্রাঘিমা (গ্রিনিচ)<\u002Ftd><\u002Ftr>\n      <tr><td>আন্তর্জাতিক তারিখ রেখা<\u002Ftd><td>১৮০° দ্রাঘিমা<\u002Ftd><\u002Ftr>\n      <tr><td>১° অক্ষাংশের দূরত্ব<\u002Ftd><td>প্রায় ১১১ কিমি<\u002Ftd><\u002Ftr>\n      <tr><td>১° দ্রাঘিমার সময় ব্যবধান<\u002Ftd><td>৪ মিনিট<\u002Ftd><\u002Ftr>\n      <tr><td>বাংলাদেশের আদর্শ দ্রাঘিমা ও সময়<\u002Ftd><td>৯০° পূর্ব · GMT + ৬:০০<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2>১০. অনুশীলন প্রশ্ন<\u002Fh2>\n  <div class=\"qa\"><p class=\"q\">১। অক্ষাংশ ও দ্রাঘিমাংশ কাকে বলে? উদাহরণসহ লেখো।<\u002Fp><\u002Fdiv>\n  <div class=\"qa\"><p class=\"q\">২। বিষুব রেখাকে পৃথিবীর বৃহত্তম বৃত্ত বলা হয় কেন?<\u002Fp><\u002Fdiv>\n  <div class=\"qa\"><p class=\"q\">৩। কর্কটক্রান্তি রেখা বাংলাদেশের জলবায়ুকে কীভাবে প্রভাবিত করেছে?<\u002Fp><\u002Fdiv>\n  <div class=\"qa\"><p class=\"q\">৪। গ্রিনিচে দুপুর ১২টা হলে ঢাকায় কত সময়? হিসাব দেখাও।<\u002Fp><p class=\"a\">উত্তর: ৯০° পূ. × ৪ মিনিট = ৬ ঘণ্টা এগিয়ে, অর্থাৎ ঢাকায় সন্ধ্যা ৬টা।<\u002Fp><\u002Fdiv>\n  <div class=\"qa\"><p class=\"q\">৫। ২১ জুন ও ২২ ডিসেম্বর সূর্য কোন কোন রেখার ওপর লম্বভাবে কিরণ দেয়?<\u002Fp><\u002Fdiv>\n\n  <p class=\"sign\">প্রস্তুতকারী: <b>GK with SHIHAB<\u002Fb> · শ্রেণি-পাঠের সহায়ক নোট · শিক্ষার্থীদের মধ্যে বিতরণযোগ্য<\u002Fp>\n<\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"view\" id=\"v-facts\">\n    <h2 class=\"sec\">এক নজরে<\u002Fh2>\n    <p class=\"sec-sub\">ক্লাসে বলার আগে চোখ বুলিয়ে নেওয়ার মতো কয়েকটি মান।<\u002Fp>\n    <div class=\"grid2\">\n      <div class=\"mini\"><div class=\"k\">বিষুব রেখা<\u002Fdiv><div class=\"v\">০°<\u002Fdiv><p>পৃথিবীর বৃহত্তম বৃত্ত, দৈর্ঘ্য প্রায় ৪০,০৭৫ কিমি<\u002Fp><\u002Fdiv>\n      <div class=\"mini\"><div class=\"k\">কর্কটক্রান্তি<\u002Fdiv><div class=\"v\">২৩° ৩০′ উত্তর<\u002Fdiv><p>বাংলাদেশের মধ্যভাগ দিয়ে গেছে<\u002Fp><\u002Fdiv>\n      <div class=\"mini\"><div class=\"k\">মকরক্রান্তি<\u002Fdiv><div class=\"v\">২৩° ৩০′ দক্ষিণ<\u002Fdiv><p>২২ ডিসেম্বর লম্ব কিরণ<\u002Fp><\u002Fdiv>\n      <div class=\"mini\"><div class=\"k\">১° অক্ষাংশ<\u002Fdiv><div class=\"v\">≈ ১১১ কিমি<\u002Fdiv><p>মোট অক্ষরেখা ১৮১টি<\u002Fp><\u002Fdiv>\n      <div class=\"mini\"><div class=\"k\">১° দ্রাঘিমা<\u002Fdiv><div class=\"v\">৪ মিনিট<\u002Fdiv><p>মোট দ্রাঘিমারেখা ৩৬০টি<\u002Fp><\u002Fdiv>\n      <div class=\"mini\"><div class=\"k\">বাংলাদেশের সময়<\u002Fdiv><div class=\"v\">GMT + ৬:০০<\u002Fdiv><p>আদর্শ দ্রাঘিমা ৯০° পূর্ব<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"foot\">\n    <span>GK with SHIHAB · ভূগোল পাঠশালা<\u002Fspan>\n    <span>অক্ষাংশ · দ্রাঘিমাংশ · বিষুবরেখা · কর্কটক্রান্তি · গ্রিনিচ মান সময়<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<script src=\"bb064bce-ddda-4455-bd56-94e21dc7828f\"><\u002Fscript>\n<script>\nconst tabs = document.getElementById('tabs');\ntabs.addEventListener('click', e => {\n  const b = e.target.closest('button[data-v]');\n  if (!b) return;\n  [...tabs.children].forEach(x => x.setAttribute('aria-selected', String(x === b)));\n  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + b.dataset.v));\n  if (b.dataset.v === 'globe' && window.__reframe) requestAnimationFrame(window.__reframe);\n  if (b.dataset.v === 'bd3d' && window.__reframeBD) requestAnimationFrame(window.__reframeBD);\n});\n<\u002Fscript>\n<script type=\"module\">\nconst WORLD = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json';\nconst stage = document.querySelector('three-d-stage');\nconst [{ THREE }, topo] = await Promise.all([stage.ready, d3.json(WORLD)]);\nconst countries = topojson.feature(topo, topo.objects.countries).features;\n\nconst R = 1, LAT = 23.8, LON = 90.4;   // ঢাকা\nconst rad = d => d * Math.PI / 180;\nconst toVec = (lon, lat, r = R) => {\n  const p = rad(lat), l = rad(lon);\n  return new THREE.Vector3(r * Math.cos(p) * Math.sin(l), r * Math.sin(p), r * Math.cos(p) * Math.cos(l));\n};\n\nconst M = {\n  ocean: new THREE.MeshStandardMaterial({ name: 'ocean', color: 0x16384c, roughness: .55, metalness: .05 }),\n  land:  new THREE.MeshStandardMaterial({ name: 'land', color: 0xd8c9a6, roughness: .85, side: THREE.DoubleSide }),\n  axis:  new THREE.MeshStandardMaterial({ name: 'axis', color: 0x9aa6b3, roughness: .45, metalness: .3 }),\n  pole:  new THREE.MeshStandardMaterial({ name: 'pole', color: 0xe8eef4, roughness: .4 }),\n  equator: new THREE.MeshStandardMaterial({ name: 'equator', color: 0xe0a83c, roughness: .4, metalness: .25 }),\n  parallel: new THREE.MeshStandardMaterial({ name: 'parallel', color: 0xf0dca8, roughness: .55, metalness: .1 }),\n  meridian: new THREE.MeshStandardMaterial({ name: 'meridian', color: 0x7fb7d8, roughness: .55, metalness: .1 }),\n  prime: new THREE.MeshStandardMaterial({ name: 'prime_meridian', color: 0x63c6d8, roughness: .4, metalness: .25 }),\n  latArc: new THREE.MeshStandardMaterial({ name: 'latitude_angle', color: 0xe0a83c, roughness: .4, metalness: .2 }),\n  lonArc: new THREE.MeshStandardMaterial({ name: 'longitude_angle', color: 0xa98cf0, roughness: .4, metalness: .2 }),\n  spot:  new THREE.MeshStandardMaterial({ name: 'place_marker', color: 0xd8563f, roughness: .45 })\n};\n\nconst model = new THREE.Group();\nmodel.name = 'okkho_draghima_globe';\n\nconst ocean = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), M.ocean);\nocean.name = 'ocean';\nmodel.add(ocean);\n\n// --- land shell (real geometry, projected onto the sphere)\nfunction ringShape(rings) {\n  const s = new THREE.Shape(rings[0].map(([x, y]) => new THREE.Vector2(x, y)));\n  for (let i = 1; i < rings.length; i++) s.holes.push(new THREE.Path(rings[i].map(([x, y]) => new THREE.Vector2(x, y))));\n  return s;\n}\nfunction subdivide(tris, maxEdge) {\n  let out = tris, pass = 0;\n  while (pass++ < 6) {\n    const next = []; let split = false;\n    for (const t of out) {\n      const [a, b, c] = t;\n      const d = [Math.hypot(b[0]-a[0], b[1]-a[1]), Math.hypot(c[0]-b[0], c[1]-b[1]), Math.hypot(a[0]-c[0], a[1]-c[1])];\n      const m = Math.max(...d);\n      if (m <= maxEdge) { next.push(t); continue; }\n      split = true;\n      const i = d.indexOf(m), P = [a, b, c];\n      const p0 = P[i], p1 = P[(i+1)%3], p2 = P[(i+2)%3];\n      const mid = [(p0[0]+p1[0])/2, (p0[1]+p1[1])/2];\n      next.push([p0, mid, p2], [mid, p1, p2]);\n    }\n    out = next;\n    if (!split) break;\n  }\n  return out;\n}\nfunction shell(polys, lift) {\n  let tris = [];\n  for (const rings of polys) {\n    const g = new THREE.ShapeGeometry(ringShape(rings));\n    const pos = g.attributes.position, idx = g.index, get = i => [pos.getX(i), pos.getY(i)];\n    if (idx) for (let i = 0; i < idx.count; i += 3) tris.push([get(idx.getX(i)), get(idx.getX(i+1)), get(idx.getX(i+2))]);\n    else for (let i = 0; i < pos.count; i += 3) tris.push([get(i), get(i+1), get(i+2)]);\n    g.dispose();\n  }\n  tris = subdivide(tris, 4);\n  const arr = new Float32Array(tris.length * 9);\n  let k = 0;\n  for (const t of tris) for (const [lon, lat] of t) {\n    const v = toVec(lon, lat, R + lift);\n    arr[k++] = v.x; arr[k++] = v.y; arr[k++] = v.z;\n  }\n  const geo = new THREE.BufferGeometry();\n  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));\n  geo.computeVertexNormals();\n  return geo;\n}\nconst allPolys = [], bdPolys = [];\nfor (const f of countries) {\n  const dst = (String(f.id) === '50' || String(f.id) === '050') ? bdPolys : allPolys;\n  for (const p of (f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates)) dst.push(p);\n}\nconst land = new THREE.Mesh(shell(allPolys.concat(bdPolys), 0.004), M.land);\nland.name = 'land';\nmodel.add(land);\n\n// --- helpers\nfunction parallelRing(lat, tube, mat, name) {\n  const r = (R + 0.02) * Math.cos(rad(lat));\n  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 12, 220), mat);\n  m.rotation.x = Math.PI / 2;\n  m.position.y = (R + 0.02) * Math.sin(rad(lat));\n  m.name = name;\n  return m;\n}\nfunction meridianRing(lon, tube, mat, name) {\n  const m = new THREE.Mesh(new THREE.TorusGeometry(R + 0.02, tube, 12, 220), mat);\n  m.rotation.y = rad(lon) + Math.PI / 2;\n  m.name = name;\n  return m;\n}\nfunction tube(points, r, mat, name) {\n  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), points.length * 2, r, 8, false), mat);\n  m.name = name;\n  return m;\n}\nawait document.fonts.ready;\nfunction label(text, pos, color, size = 1) {\n  const fs = 104, pad = 22;\n  const probe = document.createElement('canvas').getContext('2d');\n  probe.font = `700 ${fs}px \"Noto Serif Bengali\", serif`;\n  const c = document.createElement('canvas');\n  c.width = Math.ceil(probe.measureText(text).width) + pad * 2;\n  c.height = Math.round(fs * 1.4);\n  const x = c.getContext('2d');\n  x.font = `700 ${fs}px \"Noto Serif Bengali\", serif`;\n  x.textBaseline = 'middle';\n  x.fillStyle = 'rgba(10,15,22,0.78)';\n  x.beginPath(); x.roundRect(0, 0, c.width, c.height, 26); x.fill();\n  x.fillStyle = color;\n  x.fillText(text, pad, c.height / 2 + 4);\n  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;\n  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));\n  const h = 0.13 * size;\n  spr.scale.set(h * c.width / c.height, h, 1);\n  spr.position.copy(pos);\n  spr.name = 'label_' + text;\n  return spr;\n}\n\n// --- layer 1: পৃথিবীর অক্ষ ও ধ্রুব\nconst gAxis = new THREE.Group(); gAxis.name = 'layer_axis';\nconst axis = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 2 * R + 0.3, 24), M.axis);\naxis.name = 'polar_axis'; gAxis.add(axis);\nfor (const s of [1, -1]) {\n  const k = new THREE.Mesh(new THREE.SphereGeometry(0.035, 24, 16), M.pole);\n  k.position.y = s * (R + 0.15); k.name = s > 0 ? 'north_pole' : 'south_pole';\n  gAxis.add(k);\n}\ngAxis.add(label('উত্তর ধ্রুব', new THREE.Vector3(0, R + 0.34, 0), '#f2ece0', 1));\ngAxis.add(label('দক্ষিণ ধ্রুব', new THREE.Vector3(0, -R - 0.34, 0), '#f2ece0', 1));\nmodel.add(gAxis);\n\n// --- layer 2: বিষুবরেখা\nconst gEq = new THREE.Group(); gEq.name = 'layer_equator';\ngEq.add(parallelRing(0, 0.012, M.equator, 'equator_0deg'));\ngEq.add(label('বিষুবরেখা ০°', toVec(-40, 2, R + 0.16), '#e0a83c', 1.05));\nmodel.add(gEq);\n\n// --- layer 3: অক্ষরেখা\nconst gPar = new THREE.Group(); gPar.name = 'layer_parallels';\nfor (let lat = -75; lat <= 75; lat += 15) {\n  if (lat === 0) continue;\n  gPar.add(parallelRing(lat, 0.005, M.parallel, `parallel_${lat}`));\n}\ngPar.add(label('অক্ষরেখা', toVec(-140, 47, R + 0.17), '#f0dca8', 1));\nmodel.add(gPar);\n\n// --- layer 4: অক্ষাংশের কোণ\nconst gLat = new THREE.Group(); gLat.name = 'layer_latitude_angle';\n{\n  const P = toVec(LON, LAT), E = toVec(LON, 0);\n  gLat.add(tube([new THREE.Vector3(0, 0, 0), P], 0.007, M.latArc, 'radius_to_place'));\n  gLat.add(tube([new THREE.Vector3(0, 0, 0), E], 0.006, M.latArc, 'radius_to_equator'));\n  const arc = [];\n  for (let a = 0; a <= LAT; a += 1.5) arc.push(toVec(LON, a, 0.4));\n  arc.push(toVec(LON, LAT, 0.4));\n  gLat.add(tube(arc, 0.009, M.latArc, 'latitude_angle_arc'));\n  const spot = new THREE.Mesh(new THREE.SphereGeometry(0.024, 20, 14), M.spot);\n  spot.position.copy(toVec(LON, LAT, R + 0.012)); spot.name = 'place_dhaka';\n  gLat.add(spot);\n  gLat.add(label('অক্ষাংশ ২৩.৮° উ.', toVec(LON, LAT / 2, 0.66), '#e0a83c', 1));\n  gLat.add(label('ঢাকা', toVec(LON + 16, LAT + 6, R + 0.15), '#ff8b74', .9));\n}\nmodel.add(gLat);\n\n// --- layer 5: মূল মধ্যরেখা\nconst gPrime = new THREE.Group(); gPrime.name = 'layer_prime_meridian';\ngPrime.add(meridianRing(0, 0.009, M.prime, 'prime_meridian_greenwich'));\ngPrime.add(label('মূল মধ্যরেখা ০°', toVec(2, 52, R + 0.17), '#63c6d8', 1.05));\nmodel.add(gPrime);\n\n// --- layer 6: দ্রাঘিমারেখা\nconst gMer = new THREE.Group(); gMer.name = 'layer_meridians';\nfor (let lon = 15; lon < 180; lon += 15) gMer.add(meridianRing(lon, 0.005, M.meridian, `meridian_${lon}`));\ngMer.add(label('দ্রাঘিমারেখা', toVec(-115, 18, R + 0.17), '#7fb7d8', 1));\nmodel.add(gMer);\n\n// --- layer 7: দ্রাঘিমাংশের কোণ\nconst gLon = new THREE.Group(); gLon.name = 'layer_longitude_angle';\n{\n  const A = toVec(0, 0), B = toVec(LON, 0);\n  gLon.add(tube([new THREE.Vector3(0, 0, 0), A], 0.006, M.lonArc, 'radius_greenwich'));\n  gLon. l.key].checked = on;\n  });\n  syncGhost();\n  capTitle.textContent = s.title;\n  capBody.textContent = s.body;\n  capFact.textContent = s.fact;\n  [...stepsEl.children].forEach((b, k) => b.setAttribute('aria-current', String(k === cur)));\n  prevB.disabled = cur === 0;\n  nextB.disabled = cur === STEPS.length - 1;\n}\nfunction syncGhost() { ghostEarth(gLat.visible || gLon.visible); }\nprevB.addEventListener('click', () => go(cur - 1));\nnextB.addEventListener('click', () => go(cur + 1));\nwindow.addEventListener('keydown', e => {\n  if (e.key === 'ArrowRight') go(cur + 1);\n  if (e.key === 'ArrowLeft') go(cur - 1);\n});\ngo(0);\nwindow.__reframe = reframe;\n<\u002Fscript>\n<script>\n(async () => {\n  const topo = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');\n  const feats = topojson.feature(topo, topo.objects.countries).features;\n  const bd = feats.find(f => String(f.id) === '50' || String(f.id) === '050');\n  if (!bd) return;\n  const W = 620, H = 700, svg = d3.select('#bdmap');\n  const proj = d3.geoMercator().fitExtent([[70, 60], [W - 70, H - 60]], bd);\n  const path = d3.geoPath(proj);\n  const g = svg.append('g');\n  g.append('path').attr('d', path({ type: 'FeatureCollection', features: feats.filter(f => f !== bd) }))\n    .attr('fill', '#1b232e').attr('stroke', '#2b3543').attr('stroke-width', 1);\n  g.append('path').attr('d', path(d3.geoGraticule().step([1, 1])()))\n    .attr('fill', 'none').attr('stroke', '#3a4655').attr('stroke-width', .8).attr('stroke-dasharray', '2 4');\n  g.append('path').attr('d', path(bd)).attr('fill', '#2f9e77').attr('stroke', '#d8ecdf').attr('stroke-width', 1.4);\n  g.append('path').attr('d', path({ type: 'LineString', coordinates: d3.range(86, 95.01, .25).map(l => [l, 23.5]) }))\n    .attr('fill', 'none').attr('stroke', '#e0a83c').attr('stroke-width', 2.4);\n  const tp = proj([92.9, 23.5]);\n  g.append('text').attr('x', tp[0] - 6).attr('y', tp[1] - 12).attr('text-anchor', 'end')\n    .attr('f ;\n  }\n  return g;\n}\nfunction eyes(x, y, z, r, mat) {\n  const g = new THREE.Group();\n  for (const s of [-1, 1]) {\n    const e = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), mat || EYE);\n    e.position.set(x, y, s * z); g.add(e);\n  }\n  return g;\n}\nfunction legs(mat, xs, z, len, r, splay = 0) {\n  const g = new THREE.Group();\n  for (const x of xs) for (const s of [-1, 1]) {\n    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r * .78, len, 9), mat);\n    m.position.set(x, -len / 2, s * z);\n    m.rotation.x = -s * splay;\n    g.add(m);\n    const hoof = new THREE.Mesh(new THREE.SphereGeometry(r * .85, 9, 7), mat);\n    hoof.position.set(x, -len, s * z); g.add(hoof);\n  }\n  return g;\n}\n\nfunction makeAnimal(kind) {\n  const g = new THREE.Group();\n  if (kind === 'tiger') {\n    const m = M.tiger;\n    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.042, 0.15, 10, 18), m);\n    body.rotation.z = Math.PI / 2;\n    const rump = new THREE.Mesh(new THREE.SphereGeometry(0.047, 16, 12), m);\n    rump.position.x = -0.075;\n    const chest = new THREE.Mesh(new THREE.SphereGeometry(0.044, 16, 12), m);\n    chest.position.x = 0.07;\n    const neck = tubeFrom([[0.085, 0.01, 0], [0.115, 0.03, 0]], 0.03, m);\n    const head = new THREE.Mesh(new THREE.SphereGeometry(0.036, 18, 14), m);\n    head.position.set(0.137, 0.042, 0);\n    const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.021, 14, 10), m);\n    muzzle.position.set(0.164, 0.03, 0); muzzle.scale.set(1.1, .8, .9);\n    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.008, 10, 8), EYE);\n    nose.position.set(0.181, 0.032, 0);\n    g.add(body, rump, chest, neck, head, muzzle, nose);\n    g.add(eyes(0.158, 0.052, 0.014, 0.006));\n    for (const s of [-1, 1]) {\n      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.012, 10, 8), m);\n      ear.position.set(0.127, 0.07, s * 0.021); ear.scale.set(.6, 1, 1);\n      g.add(ear);\n    }\n    g.add(legs(m, [0.055, -0.055], 0.028, 0.062 ও উৎস', en: 'Rivers', title: 'নদীমাতৃক বাংলাদেশ — কোন নদীর উৎস কোথায়', data: 'riv',\n    body: 'ছোট-বড় প্রায় ৭০০ নদী দেশটিকে জালের মতো জড়িয়ে রেখেছে, কিন্তু বেশিরভাগেরই জন্ম দেশের বাইরে — হিমালয় ও পার্শ্ববর্তী পাহাড়ে। নীল প্রবাহরেখা নদীর গতিপথ, সোনালি শংকু দেশে প্রবেশমুখ আর নীল গোলক মোহনা বা পতনস্থল দেখায়।',\n    fact: 'প্রবাহরেখাগুলো পরিচিত শহর ও মিলনস্থলের প্রকৃত অবস্থান ধরে আঁকা সরলীকৃত গতিপথ।' },\n  { on: ['riv', 'conf'], label: 'শাখা ও উপনদী', en: 'Tributaries', title: 'শাখা নদী, উপনদী ও মিলনস্থল', data: 'trib',\n    body: 'যে নদী অন্য নদীতে এসে পড়ে তাকে উপনদী বলে, আর মূল নদী থেকে বেরিয়ে যাওয়া ধারাকে বলে শাখা নদী। তিস্তা ব্রহ্মপুত্রের উপনদী, গড়াই পদ্মার শাখা নদী। সোনালি বলয়গুলো প্রধান মিলনস্থল ও শাখা-বিন্দু দেখায়।',\n    fact: 'পদ্মা-ব্রহ্মপুত্র-মেঘনা মিলে পৃথিবীর বৃহত্তম বদ্বীপ — GBM নদীব্যবস্থা।' },\n  { on: ['fam'], label: 'কী জন্য বিখ্যাত', en: 'Famous for', title: 'কোন জেলা কী জন্য বিখ্যাত', data: 'fam',\n    body: 'ঢাকার জামদানি, রাজশাহী-চাঁপাইনবাবগঞ্জের আম, বগুড়ার দই, কুমিল্লার রসমালাই, টাঙ্গাইলের শাড়ি ও চমচম, দিনাজপুরের লিচু, সিলেটের চা, কক্সবাজারের সৈকত, খুলনার সুন্দরবন ও চিংড়ি — প্রতিটি জেলার নিজস্ব পরিচয়।',\n    fact: 'বাগেরহাটের ষাটগম্বুজ মসজিদ বিশ্ব ঐতিহ্য তালিকায়।' },\n  { on: ['crop'], label: 'ফসল ও কৃষি', en: 'Crops', title: 'কোন এলাকায় কোন ফসল ভালো হয়', data: 'crop',\n    body: 'মাটি ও পানির ধরন অনুযায়ী কৃষি বদলে যায় — উত্তরাঞ্চলে ধান-আলু-ভুট্টা, বরেন্দ্র অঞ্চলে আম-গম, যশোর-কুষ্টিয়ায় পাট-আখ-খেজুরগুড়, সিলেটে চা, উপকূলে লবণসহিষ্ণু ধান ও চিংড়ি, হাওরে বোরো ধান, পাহাড়ে জুম চাষ ও আনারস।',\n    fact: 'পাট বাংলাদেশের সোনালি আঁশ; ধান প্রধান খাদ্যফসল।' },\n  { on: ['env'], label: 'পরিবেশ', en: 'Environment', title: 'কোন এলাকায় কেমন পরিবেশ', data: 'env',\n    body: 'দক্ষিণ-পশ্চিমে লবণাক্ত জোয়ারভাটার সুন্দরবন, দক্ষিণ-পূর্বে পাহাড় ও চিরহরিৎ বন, উত্তর-পূর্বে বর্ষায় সমুদ্রের মতো হাওর, উত্তর-পশ্চিমে শুষ্ক বরেন্দ্র লালমাটি, আর মধ্যভাগে নদীর পলিগঠিত উর্বর প্লাবনভূমি।',\n    fact: 'সর্বোচ্চ শৃঙ্গ সাকা হাফং (বান্দরবান); গড় উচ্চতা মাত্র ১০ মিটারের কাছাকাছি।' },\n  { on: ['env', 'ani'], label: 'বন্যপ্রাণী', en: 'Wildlife', title: 'কোন কোন প্রাণী পাওয়া যায়', data: 'ani',\n    body: 'সুন্দরবনে রয়েল বেঙ্গল টাইগার, চিত্রা হরিণ ও লবণপানির কুমির; পাহাড়ি বনে এশীয় হাতি; হালদা-কর্ণফুলীতে গাঙ্গেয় ডলফিন; লাউয়াছড়ায় বিরল উল্লুক; হাকালুকি হাওরে শীতে হাজারো পরিযায়ী পাখি; সেন্ট মার্টিনে সামুদ্রিক কচ্ছপ ও প্রবাল।',\n    fact: 'জাতীয় পশু রয়েল বেঙ্গল টাইগার, জাতীয় পাখি দোয়েল, জাতীয় মাছ ইলিশ।' },\n  { on: ['div', 'dis', 'riv'], label: 'বিভাগ-জেলা-নদী', en: 'Admin + rivers', title: 'বিভাগ, জেলা ও নদী একসাথে',\n    body: 'প্রশাসনিক ভাগ আর নদীব্যবস্থা পাশাপাশি দেখলে বোঝা যায় — বড় শহর ও জেলা সদরগুলো প্রায় সবই নদীর তীরে গড়ে উঠেছে।',\n    fact: 'নদীই বাংলাদেশের যোগাযোগ, কৃষি ও বসতির মূল নিয়ামক।' }\n];\n\nconst stepsEl = document.getElementById('bdSteps');\nconst togglesEl = document.getElementById('bdToggles');\nconst tEl = document.getElementById('bdTitle'), bEl = document.getElementById('bdBody'), fEl = document.getElementById('bdFact');\nconst prevB = document.getElementById('bdPrev'), nextB = document.getElementById('bdNext');\nconst listEl = document.getElementById('bdList');\nconst DETAIL = {\n  dis: Object.entries(DIV_NAMES).map(([id, n]) => [n + ' বিভাগ', D.filter(d => d[3] === Number(id)).map(d => d[0]).join(', ')]),\n  riv: RIVERS.map(r => [r.n, 'উৎপত্তি — ' + r.src + '; ' + r.into + '; ' + r.end]),\n  trib: RIVERS.map(r => [r.n, 'উপনদী: ' + r.up + ' · শাখা নদী: ' + r.br])\n    .concat(CONFLUENCE.map(([n, , , w]) => [n + ' (মিলনস্থল)', w])),\n  fam: FAMOUS,\n  crop: CROPS.map(([n, , , w]) => [n, w]),\n  env: ENVS.map(([n, , , w]) => [n, w]),\n  ani: ANIMALS.map(([n, , , w]) => [n, w])\n};\nconst checks = {};\nlet cur = 0;\n\nSTEPS.forEach((s, i) => {\n  const b = document.createElement('button');\n  b.type = 'button'; b.className = 'step';\n  b.innerHTML = `<span class=\"num\">${i + 1}<\u002Fspan><span class=\"lbl\">${s.label}<span class=\"en\">${s.en}<\u002Fspan><\u002Fspan>`;\n  b.addEventListener('click', () => go(i));\n  stepsEl.appendChild(b);\n});\nLAYERS.forEach(l => {\n  const lab = document.createElement('label');\n  lab.className = 'tg';\n  lab.innerHTML = `<input type=\"checkbox\"><span class=\"sw\" style=\"background:${l.color}\"><\u002Fspan><span>${l.name}<\u002Fspan>`;\n  const cb = lab.querySelector('input');\n  cb.addEventListener('change', () => { l.g.visible = cb.checked; });\n  checks[l.key] = cb;\n  togglesEl.appendChild(lab);\n});\nfunction go(i) {\n  cur = Math.max(0, Math.min(STEPS.length - 1, i));\n  const s = STEPS[cur];\n  LAYERS.forEach(l => {\n    const on = s.on.includes(l.key);\n    l.g.visible = on; checks[l.key].checked = on;\n  });\n  tEl.textContent = s.title; bEl.textContent = s.body; fEl.textContent = s.fact;\n  listEl.innerHTML = (DETAIL[s.data] || []).map(([n, w]) => `<li><b>${n}<\u002Fb> — ${w}<\u002Fli>`).join('');\n  [...stepsEl.children].forEach((b, k) => b.setAttribute('aria-current', String(k === cur)));\n  prevB.disabled = cur === 0;\n  nextB.disabled = cur === STEPS.length - 1;\n}\nprevB.addEventListener('click', () => go(cur - 1));\nnextB.addEventListener('click', () => go(cur + 1));\ngo(0);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
